version: "3.8"

services:
  # 백엔드 서비스 (프론트엔드 정적 파일도 함께 서빙)
  backend:
    build:
      context: ./tayotayo
      dockerfile: ./Dockerfile
    restart: always
    depends_on:
      - database
      - redis
    ports:
      - "8096:8096"
    container_name: tayotayo_backend
    hostname: tayotayo_backend
    volumes:
      - ./tayotayo/uploads:/apps/uploads 
      - ./tayotayo/build:/opt/tomcat/webapps
      - ./frontendtayotayo/dist:/apps/frontend/dist  # 프론트엔드 빌드 파일 마운트
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/bus?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: yi0535551333@
      SPRING_PROFILES_ACTIVE: prod
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      # CORS 설정을 위한 프론트엔드 URL
      # REDIRECT_BASE_URL: https://docs.yi.or.kr:8096
    networks:
      - tayotayo_network

  # MySQL 데이터베이스
  database:
    image: mysql:8.0
    container_name: tayotayo_database
    restart: always
    environment:
      MYSQL_DATABASE: bus
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: yi0535551333@
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "23306:3306"
    volumes:
      - ./tayotayo/db/data:/var/lib/mysql
      - ./tayotayo/db/init:/docker-entrypoint-initdb.d
    networks:
      - tayotayo_network
    hostname: tayotayo_database
    command: --default-authentication-plugin=mysql_native_password
    cap_add:
      - SYS_NICE

  # Redis 캐시 서버
  redis:
    image: redis:7
    container_name: tayotayo_redis
    restart: always
    ports:
      - "16379:6379"
    volumes:
      - ./tayotayo/redis/data:/data
    networks:
      - tayotayo_network
    command: redis-server --appendonly yes

networks:
  tayotayo_network:
    driver: bridge 